# Increase the dongle's wireless range
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Report both halves' battery levels to the host
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Enable ZMK Studio for Realtime Keymap Updates (connect Studio to the dongle)
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
